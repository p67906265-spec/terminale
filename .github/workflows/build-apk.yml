name: Build Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore permanent signing key
        shell: bash
        env:
          TERMINALE_KEYSTORE_BASE64: ${{ secrets.TERMINALE_KEYSTORE_BASE64 }}
        run: |
          test -n "$TERMINALE_KEYSTORE_BASE64" || (echo "Missing TERMINALE_KEYSTORE_BASE64 secret" && exit 1)
          echo "$TERMINALE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/terminale-release.jks"

      - name: Build signed release APK
        env:
          TERMINALE_KEYSTORE_PATH: ${{ runner.temp }}/terminale-release.jks
          TERMINALE_KEYSTORE_PASSWORD: ${{ secrets.TERMINALE_KEYSTORE_PASSWORD }}
          TERMINALE_KEY_ALIAS: ${{ secrets.TERMINALE_KEY_ALIAS }}
          TERMINALE_KEY_PASSWORD: ${{ secrets.TERMINALE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Terminale-v1.15-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Terminale-v1.15-signed-apk
          path: Terminale-v1.15-release.apk
          if-no-files-found: error
